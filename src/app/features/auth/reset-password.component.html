<div class="auth-page position-relative min-vh-100 d-flex flex-column">
  <main class="container flex-grow-1 d-flex align-items-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <section class="auth-card d-grid gap-3">
          <div>
            <p class="auth-card__eyebrow">Account</p>
            <h2>Reset password</h2>
            <p class="auth-card__intro">
              Choose a new password for your account.
            </p>
          </div>

          @if (success) {
            <p class="auth-banner auth-banner--success mb-0">
              Password updated. Redirecting you to sign in&hellip;
            </p>
          } @else {
            @if (!token) {
              <p class="auth-banner auth-banner--error mb-0">
                No reset token found. Please use the link from your email.
              </p>
              <p class="auth-switch mb-0">
                <a routerLink="/forgot-password">Request a new link</a>
              </p>
            } @else {
              <form class="d-grid gap-3" [formGroup]="form" (ngSubmit)="submit()" novalidate>
                <label class="auth-field d-grid gap-2">
                  <span>New password</span>
                  <input
                    type="password"
                    formControlName="newPassword"
                    placeholder="Minimum 8 characters"
                    autocomplete="new-password"
                    [class.auth-field__control--invalid]="isFieldInvalid('newPassword')"
                  />
                  @if (isFieldInvalid('newPassword')) {
                    <small class="auth-field__error">
                      @if (form.controls.newPassword.hasError('required')) {
                        Password is required.
                      } @else if (form.controls.newPassword.hasError('minlength')) {
                        Password must be at least 8 characters long.
                      } @else {
                        Password must be 72 characters or fewer.
                      }
                    </small>
                  }
                </label>

                <label class="auth-field d-grid gap-2">
                  <span>Confirm password</span>
                  <input
                    type="password"
                    formControlName="confirmPassword"
                    placeholder="Repeat your new password"
                    autocomplete="new-password"
                    [class.auth-field__control--invalid]="isFieldInvalid('confirmPassword')"
                  />
                  @if (isFieldInvalid('confirmPassword')) {
                    <small class="auth-field__error">
                      Passwords do not match.
                    </small>
                  }
                </label>

                @if (error) {
                  <p class="auth-banner auth-banner--error mb-0">{{ error }}</p>
                }

                <button class="auth-submit" type="submit" [disabled]="isSubmitting">
                  {{ isSubmitting ? 'Saving...' : 'Set new password' }}
                </button>
              </form>

              <p class="auth-switch mb-0">
                <a routerLink="/login">Back to sign in</a>
              </p>
            }
          }
        </section>
      </div>
    </div>
  </main>

  <app-portfolio-footer />
</div>
